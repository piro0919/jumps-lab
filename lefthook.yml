# worktree で lefthook が走るたび、フックがそのツリーの node_modules を指すように書き換わる（kk-web で起きた）。
# 暗黙の入れ直しを止める。lefthook.yml を変えたときは pnpm lefthook:install を手で叩く
no_auto_install: true

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '**/*.{ts,tsx,mjs,js}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    # glob の '**/*' はリポジトリの直下のファイル（CLAUDE.md など）に当たらないので、指定しない（onigiri で CI の書式の検査が落ちた。2026-10-12）
    prettier:
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    secretlint:
      run: npx secretlint --maskSecrets {staged_files}
    # ルートの型（.next/types）を作り直してから確かめる
    typescript:
      run: pnpm typecheck
    # 足したマイグレーションの危ない書き方（表や列の削除、型の変更など）を止める（.squawk.toml）
    squawk:
      glob: 'db/migrations/*.sql'
      run: pnpm exec squawk {staged_files}
  scripts:
    # 一度コミットしたマイグレーションの書き換えと削除を止める（.lefthook/pre-commit/migrations.sh）
    'migrations.sh':
      runner: bash
commit-msg:
  scripts:
    'commitlint.sh':
      runner: bash
pre-push:
  commands:
    test:
      run: pnpm test

# 手元のフック（lefthook）と同じ確かめをかける。
# main には直接 push するので、push でも回す（プルリクエストだけだと一度も走らない）。
# 依存の更新（Renovate）の PR は手元を通らないので、ここが唯一の確かめ
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jumpslab
          POSTGRES_PASSWORD: jumpslab
          POSTGRES_DB: jumpslab
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U jumpslab" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://jumpslab:jumpslab@localhost:5436/jumpslab
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm secretlint

      - run: pnpm test

      # 使われていないファイル・エクスポート・パッケージ
      - run: pnpm knip

      # db/migrations/ が空の DB に頭から当たるか
      - run: pnpm migrate

      # src/lib/data.ts の SQL を本物の Postgres で確かめる。同じサーバーの中にテスト用の DB（jumpslab_test）を作って使う（test/db/）
      - run: pnpm test:db

      - run: pnpm build

  # 本番の組み立てを GitHub の上で起動して、最初の登録から試技を足すまでをパソコンとスマホの幅で通す
  # （playwright.config.ts）。Vercel のビルドも Neon も使わない
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jumpslab
          POSTGRES_PASSWORD: jumpslab
          POSTGRES_DB: jumpslab
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U jumpslab" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://jumpslab:jumpslab@localhost:5436/jumpslab
      # 試験用の値。ログインは Google を通さず、scripts/dev-session.ts が同じ鍵で署名した Cookie を入れる
      BETTER_AUTH_SECRET: e2e-only-secret-not-used-anywhere-else-0000
      GOOGLE_CLIENT_ID: e2e-client-id
      GOOGLE_CLIENT_SECRET: e2e-client-secret
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm migrate

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
